### YamlMime:TSType
name: ExcelScript.FormatProtection
uid: ExcelScript!ExcelScript.FormatProtection:interface
package: ExcelScript!
fullName: ExcelScript.FormatProtection
summary: Represents the format protection of a range object.
remarks: >-




  #### Used by


  -
  [ExcelScript.RangeFormat](/javascript/api/office-scripts/excelscript/excelscript.rangeformat):
  [getProtection](/javascript/api/office-scripts/excelscript/excelscript.rangeformat#excelscript-excelscript-rangeformat-getprotection-member(1))

  #### Examples


  ```TypeScript

  /**
   * This script locks a cell and hides its formula, then protects the worksheet.
   */
  function main(workbook: ExcelScript.Workbook) {
    const worksheet = workbook.getActiveWorksheet();
    const formulaCell = worksheet.getRange("B2");
    formulaCell.setFormula("=1+1");

    const protection = formulaCell.getFormat().getProtection();
    protection.setLocked(true);
    protection.setFormulaHidden(true);

    const isLocked = protection.getLocked();
    const isFormulaHidden = protection.getFormulaHidden();

    worksheet.getProtection().protect();
    console.log(`Locked: ${isLocked}; formula hidden: ${isFormulaHidden}`);
  }

  ```

